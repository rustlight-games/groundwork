[package]
name = "terrain_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The terrain framework's command line: validate, inspect, render"

# One binary, named for the verb rather than the crate. `terrain render` reads
# better than `terrain_cli render`, and the crate name only ever appears in a
# Cargo command.
[[bin]]
name = "terrain"
path = "src/main.rs"

[dependencies]
terrain_core.workspace = true
terrain_generators.workspace = true
terrain_format.workspace = true
terrain_scene.workspace = true
terrain_cycles.workspace = true
terrain_bench.workspace = true
bevy.workspace = true
clap.workspace = true
image.workspace = true
