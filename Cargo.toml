[workspace]
resolver = "2"
members = ["crates/*", "tools/terrain_cli", "tools/terrain_preview"]
# `tools/bw_cycles` is not a Rust crate — it is the Blender-side half of the
# path-traced renderer, driven as a subprocess. It lives under `tools/` because
# that is where a thing you run rather than link belongs, and Cargo has to be
# told it is not a member.
exclude = ["tools/bw_cycles"]

# Virtual, with no root package. There used to be one — the game binary — and its
# absence is the point rather than a tidy-up: nothing in this repository is an
# application any more. The framework compiles terrain and renders it, and the
# things you run are tools that sit beside it.

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
# --- internal ---------------------------------------------------------------
terrain_core = { path = "crates/terrain_core" }
terrain_format = { path = "crates/terrain_format" }
terrain_scene = { path = "crates/terrain_scene" }
bw_bench = { path = "crates/bw_bench" }
bw_grass = { path = "crates/bw_grass" }

# --- bevy -------------------------------------------------------------------
# Only the preview backend and the tool that opens a window take Bevy. Every
# headless crate — the document, the sampler, the scene, the Cycles backend —
# must stay clear of it, because a terrain compiler that cannot run without a
# renderer in the graph is a renderer with a compiler attached.
bevy = "0.19.0"
# The maths, on its own. Pinned to the version Bevy re-exports so the two are the
# same types rather than two types that convert.
glam = "0.32"

# --- general ----------------------------------------------------------------
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"] }
rayon = "1.12"
# Reading traced tiles back to crop and filter them, and writing finished
# plates. Bevy already depends on it, so this costs nothing but the line.
image = { version = "0.25", default-features = false, features = ["png"] }
# Performance benchmarks. `html_reports` is off: the suite's durable record is a
# `bw_bench::Report` under benchmarks/baseline/, and criterion's own HTML wants
# plotters and a good deal of build time to produce something nothing reads.
criterion = { version = "0.7", default-features = false, features = [
    "cargo_bench_support",
] }

# Lightly optimise our own code, so a preview window is usable while debugging.
[profile.dev]
opt-level = 1

# Fully optimise Bevy and every other dependency. They are compiled once and
# then cached, so the up-front cost is paid a single time.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
