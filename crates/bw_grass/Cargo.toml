[package]
name = "bw_grass"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Isometric grass: a baked ground-surface cache and its renderer"

[dependencies]
bw_core.workspace = true
bevy.workspace = true
# Pages are independent of one another by construction — every placement decision
# is a pure function of world coordinates — so baking them is embarrassingly
# parallel and threading it changes nothing about the result.
rayon.workspace = true

[dev-dependencies]
bw_bench.workspace = true
# The headless bake example writes a PNG, and the metrics example reads the
# reference plate back in to compare descriptors against it.
image.workspace = true

[[example]]
name = "grass_bake"
path = "examples/grass_bake.rs"

[[example]]
name = "grass_score"
path = "examples/grass_score.rs"

[[example]]
name = "grass_sandbox"
path = "examples/grass_sandbox.rs"
