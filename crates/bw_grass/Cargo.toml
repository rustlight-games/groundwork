[package]
name = "bw_grass"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Isometric grass: a baked ground-surface cache and its renderer"

[dependencies]
# The generic scene IR, so the grass can be expressed in it before the generator
# itself moves. See `src/generic.rs`.
terrain_core.workspace = true
terrain_generators.workspace = true
terrain_scene.workspace = true
# Bevy only for the runtime integration — the plugin, the material and the page
# cache. Everything that decides where a blade goes takes glam directly, which is
# the same maths: bevy::prelude's Vec2 and Vec3 *are* glam's, so the swap was
# bit-identical and the pinned fingerprints did not move.
bevy.workspace = true
glam.workspace = true
# Pages are independent of one another by construction — every placement decision
# is a pure function of world coordinates — so baking them is embarrassingly
# parallel and threading it changes nothing about the result.
rayon.workspace = true
# The traced-plate driver reads its tiles back to crop and filter them, and
# writes the assembled plate. It was a dev-dependency while that driver lived in
# an example; it is a real one now that the driver is in the library, where a
# second caller can reach it. Bevy already depends on `image`, so the cost is the
# line rather than the compile.
image.workspace = true

[dev-dependencies]
glam.workspace = true
bw_bench.workspace = true
criterion.workspace = true
rayon.workspace = true

[[example]]
name = "grass_bake"
path = "examples/grass_bake.rs"

[[example]]
name = "grass_snapshot"
path = "examples/grass_snapshot.rs"

# The laboratory plate: a small, known population, for judging one mark at a
# time instead of judging a meadow.
[[example]]
name = "grass_lab"
path = "examples/grass_lab.rs"

# Paired training data: one scene, rendered cheaply and expensively.
[[example]]
name = "grass_dataset"
path = "examples/grass_dataset.rs"

# The look gate: absolute numbers for a plate, against reference art.
[[example]]
name = "grass_critique"
path = "examples/grass_critique.rs"

# Placement here, light transport in Cycles.
[[example]]
name = "grass_cycles"
path = "examples/grass_cycles.rs"

# Fill the page cache the game reads, so `./run` shows traced grass.
[[example]]
name = "grass_prebake"
path = "examples/grass_prebake.rs"

# The performance suite. `harness = false` because criterion supplies its own.
[[bench]]
name = "bake"
path = "benches/bake.rs"
harness = false
